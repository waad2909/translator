<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Translator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-secondary">
    <div class="container min-vh-100 d-flex align-items-center">
      <div class="row justify-content-center w-100">
        <main
          data-bs-theme="dark"
          class="col-12 col-md-10 col-lg-7 bg-black text-white rounded-3 p-4 text-center"
        >
          <h1 class="mb-4">Translator App</h1>

          <div class="row g-3">
            <div class="col-6">
              <textarea
                id="from-text"
                class="form-control bg-black text-white fw-bold border-2 border-light"
                rows="10"
                placeholder="Type here..."
              ></textarea>
              <select
                id="from-lang"
                class="form-select bg-black text-white border-light w-75 mx-auto mt-3"
              ></select>
            </div>
            <div class="col-6">
              <textarea
                id="to-text"
                class="form-control bg-black text-white fw-bold border-2 border-light"
                rows="10"
                readonly
              ></textarea>
              <select
                id="to-lang"
                class="form-select bg-black text-white border-light w-75 mx-auto mt-3"
              ></select>
            </div>
          </div>

          <button id="translate-btn" class="btn btn-outline-primary mt-4">
            Translate
          </button>
        </main>
      </div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
